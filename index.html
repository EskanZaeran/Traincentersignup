<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ثبت‌نام آموزشگاه</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
:root{
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --border:#E7E9EE;
  --text:#1F2430;
  --muted:#8A8F9C;
  --primary:#4F5DFF;
  --primary-dark:#3A46D9;
  --danger:#E5484D;
  --success:#22C55E;
  --radius:20px;
  --shadow:0 4px 20px rgba(31,36,48,0.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:Vazirmatn,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:20px 12px calc(20px + env(safe-area-inset-bottom));
  animation:fadeIn .4s ease both;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{opacity:1;transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes checkPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)}
  40%,60%{transform:translateX(4px)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(79,93,255,.25)}
  50%{box-shadow:0 0 0 8px rgba(79,93,255,0)}
}

.wrap{width:100%;max-width:560px}

.progress{display:flex;gap:8px;margin-bottom:18px}
.progress div{flex:1;height:4px;border-radius:4px;background:#ddd;overflow:hidden;position:relative;transition:background .35s ease}
.progress .active{background:var(--primary)}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:20px 18px;
  margin-bottom:16px;
  animation:slideUp .4s cubic-bezier(.22,1,.36,1) both;
}
.card h2{margin:0 0 16px;font-size:19px}

label{display:block;margin:16px 0 6px;font-size:14px;transition:color .2s}
input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  font-family:inherit;
  font-size:16px;
  background:#FAFBFC;
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input:focus{
  border-color:var(--primary);
  background:#fff;
  box-shadow:0 0 0 4px rgba(79,93,255,.12);
}
input.invalid{
  border-color:var(--danger);
  animation:shake .35s ease;
}

.error{color:var(--danger);font-size:12px;display:none;margin-top:6px;animation:slideUp .25s ease both}

.btn{
  padding:14px 22px;
  border:none;
  border-radius:14px;
  font-family:inherit;
  font-size:15px;
  cursor:pointer;
  min-height:48px;
  touch-action:manipulation;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
  position:relative;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;flex:1;box-shadow:0 6px 16px rgba(79,93,255,.28)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.7;cursor:default;transform:none}
.btn-ghost{background:none;color:var(--muted)}
.btn-ghost:hover{color:var(--text)}
.row-btns{display:flex;gap:10px;margin-top:20px}

.spinner{
  display:inline-block;
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-left:8px;
}

.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.class-card{
  border:2px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  background:#fff;
  transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  touch-action:manipulation;
}
.class-card:active{transform:scale(.97)}
.class-card.selected{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(79,93,255,.15);
  animation:pulseGlow 1.4s ease 1;
}
.class-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:transform .3s ease}
.class-card:hover img{transform:scale(1.04)}
.class-body{text-align:center;padding:10px}
.old-price{text-decoration:line-through;color:#999;font-size:11px}
.new-price{font-weight:bold;color:var(--primary-dark)}

.summary-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;
  animation:slideUp .3s ease both;
}
#sumClasses p{
  margin:6px 0;
  padding:8px 12px;
  background:#FAFBFC;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:13.5px;
  animation:slideUp .3s ease both;
}
.total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#F3F4FF;
  padding:14px 16px;
  border-radius:14px;
  margin-top:15px;
  border:1px solid #DBDFFF;
  animation:slideUp .35s ease both;
}
.total-row strong{color:var(--primary-dark);font-size:16px}

.payment-box{
  width:100%;
  background:#F3F4FF;
  padding:20px 16px;
  border-radius:16px;
  text-align:center;
  border:1px solid #DBDFFF;
  animation:slideUp .4s ease both;
}
.payment-box h2{margin:6px 0 0;color:var(--primary-dark);font-size:24px}

.success-icon{
  width:64px;height:64px;
  border-radius:50%;
  background:rgba(34,197,94,.12);
  color:var(--success);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  font-size:32px;
  animation:checkPop .5s cubic-bezier(.22,1.4,.36,1) both;
}

.copy-card{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#FAFBFC;
  border:1px dashed var(--border);
  border-radius:12px;
  padding:10px 16px;
  cursor:pointer;
  transition:background .2s ease, border-color .2s ease;
  font-family:inherit;
  font-size:15px;
  color:var(--text);
  letter-spacing:1px;
}
.copy-card:active{transform:scale(.97)}
.copy-card:hover{background:#F0F1FB;border-color:var(--primary)}
.copy-hint{font-size:11px;color:var(--muted);margin-top:6px}

#toast{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--text);
  color:#fff;
  padding:12px 20px;
  border-radius:12px;
  font-size:13.5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:60;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<body>
<div class="wrap">

<div class="progress" id="progress">
<div id="p1" class="active"></div>
<div id="p2"></div>
<div id="p3"></div>
</div>

<div class="card" id="step1">
<h2>اطلاعات فردی</h2>

<label>نام و نام خانوادگی</label>
<input id="fullname">

<label>کد ملی</label>
<input id="nationalCode" inputmode="numeric">
<p id="nationalCodeError" class="error">کد ملی صحیح نیست</p>

<label>نام پدر</label>
<input id="fatherName">

<label>تاریخ تولد</label>
<input id="birthDate" placeholder="۱۴۰۰/۰۱/۰۱" inputmode="numeric">

<label>شماره همراه</label>
<input id="phone" inputmode="numeric">

<label>شماره ثابت</label>
<input id="landline" inputmode="numeric">

<div class="row-btns">
<button class="btn btn-primary" onclick="goStep(2)">مرحله بعد</button>
</div>
</div>

<div class="card" id="step2" style="display:none">
<h2>انتخاب کلاس‌ها</h2>
<div class="class-grid" id="classGrid"></div>

<div class="row-btns">
<button class="btn btn-ghost" onclick="goStep(1)">قبلی</button>
<button class="btn btn-primary" onclick="goStep(3)">مرحله بعد</button>
</div>
</div>

<div class="card" id="step3" style="display:none">
<h2>خلاصه ثبت‌نام</h2>

<div class="summary-item"><span>نام</span><strong id="sumName"></strong></div>
<div class="summary-item"><span>کد ملی</span><strong id="sumNationalCode"></strong></div>
<div class="summary-item"><span>نام پدر</span><strong id="sumFatherName"></strong></div>
<div class="summary-item"><span>تولد</span><strong id="sumBirthDate"></strong></div>
<div class="summary-item"><span>همراه</span><strong id="sumPhone"></strong></div>
<div class="summary-item"><span>ثابت</span><strong id="sumLandline"></strong></div>

<div id="sumClasses"></div>

<div class="total-row">
<span>مجموع هزینه</span>
<strong id="sumTotal"></strong>
</div>

<div class="row-btns">
<button class="btn btn-ghost" onclick="goStep(2)">قبلی</button>
<button class="btn btn-primary" id="submitBtn" onclick="submitForm()">ثبت‌نام نهایی</button>
</div>
</div>

<div class="card" id="step4" style="display:none">
<div style="text-align:center">
  <div class="success-icon">✓</div>
  <h2 style="margin-bottom:20px">ثبت‌نام با موفقیت انجام شد</h2>
</div>

<div class="payment-box">
<div>مبلغ قابل پرداخت</div>
<h2 id="paymentAmount"></h2>
</div>

<p style="text-align:center;margin-top:20px">
شماره کارت
<br><br>
<button class="copy-card" onclick="copyCard()">
  <span id="cardNumber">6219861952461035</span>
  <span id="copyIcon">📋</span>
</button>
<br>
<span class="copy-hint" id="copyHint">برای کپی روی شماره بزن</span>
<br><br>
به نام نام صاحب کارت
</p>

<p style="text-align:center">
پس از واریز، فیش واریزی را در ایتا به آیدی زیر ارسال کنید:
<br><br>
<strong>@m_amin_128</strong>
</p>
</div>

</div>

<div id="toast"></div>

<script>

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfoCnklXATD20wZaqrcHjItTQEdV9D3VI4I5A-zwYMiZXjAzJNErDuIKW0he6k4IRw/exec';

const classes=[
{id:'c1',name:'خطاطی',price:480000,img:'images/khatati.jpg'},
{id:'c2',name:'عکاسی',price:550000,img:'images/akasi.jpg'},
{id:'c3',name:'تدوین',price:1200000,img:'images/tadvin.jpg'},
{id:'c4',name:'کورل',price:680000,img:'images/corel.jpg'},
{id:'c5',name:'شاعری',price:350000,img:'images/shaeri.jpg'},
{id:'all',name:'پک جامع',price:3000000,oldPrice:3260000,img:'images/pak-jame.jpg'}
];

const selected=new Set();

function toEnglishNumbers(v){
return v.replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776))
.replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632));
}

['nationalCode','phone','landline','birthDate'].forEach(id=>{
document.getElementById(id).addEventListener('input',function(){
this.value=toEnglishNumbers(this.value);
this.classList.remove('invalid');
});
});

function formatPrice(n){
return n.toLocaleString('fa-IR')+' تومان';
}

function renderClasses(){
classGrid.innerHTML=classes.map((c,i)=>`
<div class="class-card" id="card-${c.id}" style="animation-delay:${i*.05}s" onclick="toggleClass('${c.id}')">
<img src="${c.img}">
<div class="class-body">
<b>${c.name}</b><br>
${c.oldPrice?`<span class="old-price">${formatPrice(c.oldPrice)}</span><br><span class="new-price">${formatPrice(c.price)}</span>`:formatPrice(c.price)}
</div>
</div>`).join('');
}

function toggleClass(id){
if(id==='all'){
selected.clear();
document.querySelectorAll('.class-card').forEach(x=>x.classList.remove('selected'));
selected.add('all');
document.getElementById('card-all').classList.add('selected');
return;
}
if(selected.has('all')){
selected.delete('all');
document.getElementById('card-all').classList.remove('selected');
}
const card=document.getElementById('card-'+id);
if(selected.has(id)){
selected.delete(id);card.classList.remove('selected');
}else{
selected.add(id);card.classList.add('selected');
}
}

function shakeInvalid(el){
el.classList.remove('invalid');
void el.offsetWidth;
el.classList.add('invalid');
}

function goStep(n){
if(n===2){
const fields=[fullname,nationalCode,fatherName,birthDate,phone,landline];
const empty=fields.filter(f=>!f.value.trim());
if(empty.length){
empty.forEach(shakeInvalid);
showToast('لطفاً همه فیلدها را کامل کن');
return;
}
}
if(n===3&&selected.size===0){
showToast('حداقل یک کلاس انتخاب کن');
return;
}
const cur=document.querySelector('.card[style*="block"], .card:not([style*="none"])');
['1','2','3'].forEach(i=>{
const el=document.getElementById('step'+i);
if(i==n){
el.style.display='block';
el.style.animation='none';
void el.offsetWidth;
el.style.animation='slideUp .4s cubic-bezier(.22,1,.36,1) both';
}else{
el.style.display='none';
}
document.getElementById('p'+i).classList.toggle('active',i<=n);
});
if(n===3)fillSummary();
window.scrollTo({top:0,behavior:'smooth'});
}

function fillSummary(){
sumName.textContent=fullname.value;
sumNationalCode.textContent=nationalCode.value;
sumFatherName.textContent=fatherName.value;
sumBirthDate.textContent=birthDate.value;
sumPhone.textContent=phone.value;
sumLandline.textContent=landline.value;

let total=0;
sumClasses.innerHTML=[...selected].map((id,i)=>{
const c=classes.find(x=>x.id===id);
total+=c.price;
return `<p style="animation-delay:${i*.05}s">${c.name} - ${formatPrice(c.price)}</p>`;
}).join('');
sumTotal.textContent=formatPrice(total);
}

function showToast(msg){
const t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

function copyCard(){
const num=document.getElementById('cardNumber').textContent;
navigator.clipboard.writeText(num).then(()=>{
document.getElementById('copyIcon').textContent='✅';
document.getElementById('copyHint').textContent='کپی شد!';
setTimeout(()=>{
document.getElementById('copyIcon').textContent='📋';
document.getElementById('copyHint').textContent='برای کپی روی شماره بزن';
},1800);
}).catch(()=>showToast('کپی نشد، دستی کپی کن'));
}

function submitForm(){
const total=[...selected].reduce((s,id)=>s+classes.find(c=>c.id===id).price,0);

const btn=document.getElementById('submitBtn');
btn.disabled=true;
btn.innerHTML='در حال ثبت<span class="spinner"></span>';

fetch(SCRIPT_URL,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify({
name:fullname.value,
nationalCode:nationalCode.value,
fatherName:fatherName.value,
birthDate:birthDate.value,
phone:phone.value,
landline:landline.value,
classes:[...selected].map(id=>classes.find(c=>c.id===id).name),
total:total
})
})
.then(r=>r.json())
.then(r=>{
btn.disabled=false;
btn.textContent='ثبت‌نام نهایی';

if(r.status==='duplicate'){
showToast('این کد ملی قبلاً ثبت‌نام کرده است');
return;
}
paymentAmount.textContent=formatPrice(total);
['1','2','3'].forEach(i=>document.getElementById('step'+i).style.display='none');
step4.style.display='block';
progress.style.display='none';
window.scrollTo({top:0,behavior:'smooth'});
})
.catch(()=>{
btn.disabled=false;
btn.textContent='ثبت‌نام نهایی';
showToast('خطا در ارسال اطلاعات، دوباره امتحان کن');
});
}

renderClasses();

</script>
</body>
</html>
