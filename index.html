<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ثبت‌نام آموزشگاه</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
:root{
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --border:#E7E9EE;
  --text:#1F2430;
  --muted:#8A8F9C;
  --primary:#4F5DFF;
  --primary-dark:#3A46D9;
  --danger:#E5484D;
  --radius:20px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Vazirmatn,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:20px 12px;
}
.wrap{width:100%;max-width:560px}
.progress{display:flex;gap:8px;margin-bottom:18px}
.progress div{flex:1;height:4px;border-radius:4px;background:#ddd}
.progress .active{background:var(--primary)}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px 18px;
  margin-bottom:16px;
}
label{display:block;margin:16px 0 6px}
input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  font-family:inherit;
}
.error{color:var(--danger);font-size:12px;display:none}
.btn{
  padding:14px 22px;
  border:none;
  border-radius:14px;
  font-family:inherit;
  cursor:pointer;
}
.btn-primary{background:var(--primary);color:#fff;flex:1}
.btn-ghost{background:none}
.row-btns{display:flex;gap:10px;margin-top:20px}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.class-card{
  border:2px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}
.class-card.selected{border-color:var(--primary)}
.class-card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.class-body{text-align:center;padding:10px}
.old-price{text-decoration:line-through;color:#999;font-size:11px}
.new-price{font-weight:bold;color:var(--primary-dark)}
.summary-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.total-row{
  display:flex;
  justify-content:space-between;
  background:#F3F4FF;
  padding:14px;
  border-radius:14px;
  margin-top:15px;
}
.payment-box{
  width:100%;
  background:#F3F4FF;
  padding:16px;
  border-radius:16px;
  text-align:center;
}
</style>
</head>

<body>
<div class="wrap">

<div class="progress" id="progress">
<div id="p1" class="active"></div>
<div id="p2"></div>
<div id="p3"></div>
</div>

<div class="card" id="step1">
<h2>اطلاعات فردی</h2>

<label>نام و نام خانوادگی</label>
<input id="fullname">

<label>کد ملی</label>
<input id="nationalCode">
<p id="nationalCodeError" class="error">کد ملی صحیح نیست</p>

<label>نام پدر</label>
<input id="fatherName">

<label>تاریخ تولد</label>
<input id="birthDate" placeholder="۱۴۰۰/۰۱/۰۱">

<label>شماره همراه</label>
<input id="phone">

<label>شماره ثابت</label>
<input id="landline">

<div class="row-btns">
<button class="btn btn-primary" onclick="goStep(2)">مرحله بعد</button>
</div>
</div>

<div class="card" id="step2" style="display:none">
<h2>انتخاب کلاس‌ها</h2>
<div class="class-grid" id="classGrid"></div>

<div class="row-btns">
<button class="btn btn-ghost" onclick="goStep(1)">قبلی</button>
<button class="btn btn-primary" onclick="goStep(3)">مرحله بعد</button>
</div>
</div>

<div class="card" id="step3" style="display:none">
<h2>خلاصه ثبت‌نام</h2>

<div class="summary-item"><span>نام</span><strong id="sumName"></strong></div>
<div class="summary-item"><span>کد ملی</span><strong id="sumNationalCode"></strong></div>
<div class="summary-item"><span>نام پدر</span><strong id="sumFatherName"></strong></div>
<div class="summary-item"><span>تولد</span><strong id="sumBirthDate"></strong></div>
<div class="summary-item"><span>همراه</span><strong id="sumPhone"></strong></div>
<div class="summary-item"><span>ثابت</span><strong id="sumLandline"></strong></div>

<div id="sumClasses"></div>

<div class="total-row">
<span>مجموع هزینه</span>
<strong id="sumTotal"></strong>
</div>

<div class="row-btns">
<button class="btn btn-ghost" onclick="goStep(2)">قبلی</button>
<button class="btn btn-primary" onclick="submitForm()">ثبت‌نام نهایی</button>
</div>
</div>

<div class="card" id="step4" style="display:none">
<h2 style="text-align:center">ثبت‌نام با موفقیت انجام شد</h2>

<div class="payment-box">
<div>مبلغ قابل پرداخت</div>
<h2 id="paymentAmount"></h2>
</div>

<p style="text-align:center">
شماره کارت
<br><br>
<strong id="cardNumber">6219861952461035</strong>
<br><br>
به نام نام صاحب کارت
</p>

<p style="text-align:center">
پس از واریز، فیش واریزی را در ایتا به آیدی زیر ارسال کنید:
<br><br>
<strong>@m_amin_128</strong>
</p>
</div>

</div>

<script>

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfoCnklXATD20wZaqrcHjItTQEdV9D3VI4I5A-zwYMiZXjAzJNErDuIKW0he6k4IRw/exec';

const classes=[
{id:'c1',name:'خطاطی',price:480000,img:'images/khatati.jpg'},
{id:'c2',name:'عکاسی',price:550000,img:'images/akasi.jpg'},
{id:'c3',name:'تدوین',price:1200000,img:'images/tadvin.jpg'},
{id:'c4',name:'کورل',price:680000,img:'images/corel.jpg'},
{id:'c5',name:'شاعری',price:350000,img:'images/shaeri.jpg'},
{id:'all',name:'پک جامع',price:3000000,oldPrice:3260000,img:'images/pak-jame.jpg'}
];

const selected=new Set();

function toEnglishNumbers(v){
return v.replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-1776))
.replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-1632));
}

['nationalCode','phone','landline','birthDate'].forEach(id=>{
document.getElementById(id).addEventListener('input',function(){
this.value=toEnglishNumbers(this.value);
});
});

function formatPrice(n){
return n.toLocaleString('fa-IR')+' تومان';
}

function renderClasses(){
classGrid.innerHTML=classes.map(c=>`
<div class="class-card" id="card-${c.id}" onclick="toggleClass('${c.id}')">
<img src="${c.img}">
<div class="class-body">
<b>${c.name}</b><br>
${c.oldPrice?`<span class="old-price">${formatPrice(c.oldPrice)}</span><br><span class="new-price">${formatPrice(c.price)}</span>`:formatPrice(c.price)}
</div>
</div>`).join('');
}

function toggleClass(id){
if(id==='all'){
selected.clear();
document.querySelectorAll('.class-card').forEach(x=>x.classList.remove('selected'));
selected.add('all');
document.getElementById('card-all').classList.add('selected');
return;
}
if(selected.has('all')){
selected.delete('all');
document.getElementById('card-all').classList.remove('selected');
}
const card=document.getElementById('card-'+id);
if(selected.has(id)){
selected.delete(id);card.classList.remove('selected');
}else{
selected.add(id);card.classList.add('selected');
}
}

function goStep(n){
if(n===2){
if(!fullname.value.trim()||!nationalCode.value.trim()||!fatherName.value.trim()||!birthDate.value.trim()||!phone.value.trim()||!landline.value.trim()){
alert('همه فیلدها را کامل کن');return;
}
}
if(n===3&&selected.size===0){alert('حداقل یک کلاس انتخاب کن');return;}
['1','2','3'].forEach(i=>{
document.getElementById('step'+i).style.display=i==n?'block':'none';
document.getElementById('p'+i).classList.toggle('active',i<=n);
});
if(n===3)fillSummary();
}

function fillSummary(){
sumName.textContent=fullname.value;
sumNationalCode.textContent=nationalCode.value;
sumFatherName.textContent=fatherName.value;
sumBirthDate.textContent=birthDate.value;
sumPhone.textContent=phone.value;
sumLandline.textContent=landline.value;

let total=0;
sumClasses.innerHTML=[...selected].map(id=>{
const c=classes.find(x=>x.id===id);
total+=c.price;
return `<p>${c.name} - ${formatPrice(c.price)}</p>`;
}).join('');
sumTotal.textContent=formatPrice(total);
}

function submitForm(){
const total=[...selected].reduce((s,id)=>s+classes.find(c=>c.id===id).price,0);

fetch(SCRIPT_URL,{
method:'POST',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body:JSON.stringify({
name:fullname.value,
nationalCode:nationalCode.value,
fatherName:fatherName.value,
birthDate:birthDate.value,
phone:phone.value,
landline:landline.value,
classes:[...selected].map(id=>classes.find(c=>c.id===id).name),
total:total
})
})
.then(r=>r.json())
.then(r=>{
if(r.status==='duplicate'){
alert('این کد ملی قبلاً ثبت‌نام کرده است');return;
}
paymentAmount.textContent=formatPrice(total);
['1','2','3'].forEach(i=>document.getElementById('step'+i).style.display='none');
step4.style.display='block';
progress.style.display='none';
})
.catch(()=>alert('خطا در ارسال اطلاعات'));
}

renderClasses();

</script>
</body>
</html>
